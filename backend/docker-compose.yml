version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jugnu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jugnu
      POSTGRES_PASSWORD: jugnu_dev_password
      POSTGRES_DB: jugnu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jugnu -d jugnu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jugnu-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://jugnu:jugnu_dev_password@postgres:5432/jugnu_db?schema=public
      JWT_SECRET: jugnu-docker-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: jugnu-docker-refresh-secret-change-in-production
      JWT_REFRESH_EXPIRES_IN: 30d
      PORT: 3000
      NODE_ENV: production
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_ENABLED: "false"
      ENCRYPTION_KEY: jugnu-docker-encryption-key-change-in-production
      CORS_ORIGIN: "http://localhost:5173"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  postgres_data:
